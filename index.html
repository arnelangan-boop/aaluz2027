<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ÅLUZ 2027</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    height:100%;
}

body{
    background:#000;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
}

/* Bakgrunnsbilde */

#background{
    position:fixed;
    inset:0;

    background-size:cover;
    background-position:center center;

    opacity:0;
    transform:scale(1.08);

    transition:
        opacity 0.4s ease,
        transform 1.5s ease;
}

#background.show{
    opacity:0.9;
    transform:scale(1);
}

/* Mørk film-overlay */

.overlay{
    position:fixed;
    inset:0;

    background:
        radial-gradient(
            circle,
            rgba(0,0,0,0.15),
            rgba(0,0,0,0.88)
        );
}

/* Tekst */

.content{
    position:fixed;
    inset:0;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    z-index:10;
}

h1{
    color:white;

    font-size:clamp(3rem,8vw,6rem);

    text-transform:uppercase;
    letter-spacing:0.6rem;

    text-shadow:
        0 0 10px rgba(255,255,255,.25),
        0 0 40px rgba(255,255,255,.15);
}

.subtitle{
    margin-top:15px;

    color:#cccccc;

    text-transform:uppercase;
    letter-spacing:0.5rem;

    font-size:1rem;
}

</style>
</head>

<body>

<div id="background"></div>

<div class="overlay"></div>

<div class="content">
    <h1>ÅLUZ 2027</h1>
    <div class="subtitle">soon</div>
</div>

<script>

/*
--------------------------------------------------
VANLIGE BILDER (75 %)
--------------------------------------------------
*/

const commonImages = [
    "beer.jpg",
    "boat.jpg",
    "table.jpg",
    "group.jpg"
];

/*
--------------------------------------------------
SJELDNE BILDER (22 %)
--------------------------------------------------
*/

const rareImages = [
    "toilet.jpg",
    "fuel.jpg"
];

/*
--------------------------------------------------
LEGENDARISKE BILDER (3 %)
--------------------------------------------------
*/

const legendaryImages = [
    "finger.jpg",
    "hat.jpg"
];

const background =
    document.getElementById("background");

function pickImage() {

    const roll = Math.random() * 100;

    // 75%

    if (roll < 75) {

        return {
            image:
                commonImages[
                    Math.floor(
                        Math.random() *
                        commonImages.length
                    )
                ],
            type:"common"
        };
    }

    // 22%

    if (roll < 97) {

        return {
            image:
                rareImages[
                    Math.floor(
                        Math.random() *
                        rareImages.length
                    )
                ],
            type:"rare"
        };
    }

    // 3%

    return {

        image:
            legendaryImages[
                Math.floor(
                    Math.random() *
                    legendaryImages.length
                )
            ],

        type:"legendary"
    };
}

function flashImage() {

    const result = pickImage();

    background.style.backgroundImage =
        `url("${result.image}")`;

    background.classList.add("show");

    let duration;

    if (result.type === "common") {

        duration =
            1200 +
            Math.random() * 600;

    }

    else if (result.type === "rare") {

        duration = 800;

    }

    else {

        duration = 500;

    }

    setTimeout(() => {

        background.classList.remove("show");

    }, duration);

    const nextFlash =

        6000 +

        Math.random() * 9000;

    setTimeout(
        flashImage,
        nextFlash
    );
}

/*
--------------------------------------------------
FØRSTE BLINK
--------------------------------------------------
*/

setTimeout(
    flashImage,
    6000
);

</script>

</body>
</html>
