<script>

/* -------------------------------- */
/* BILDEBIBLIOTEK */
/* -------------------------------- */

const images = [

    {
        file:"beer.jpg",
        type:"common"
    },

    {
        file:"boat.jpg",
        type:"common"
    },

    {
        file:"table.jpg",
        type:"common"
    },

    {
        file:"group.jpg",
        type:"common"
    },

    {
        file:"toilet.jpg",
        type:"rare"
    },

    {
        file:"fuel.jpg",
        type:"rare"
    },

    {
        file:"finger.jpg",
        type:"legendary"
    },

    {
        file:"hat.jpg",
        type:"legendary"
    }

];

/* -------------------------------- */
/* ELEMENTER */
/* -------------------------------- */

const background =
    document.getElementById("background");

const vhs =
    document.getElementById("vhs");

const staticSound =
    document.getElementById("staticSound");

const startButton =
    document.getElementById("startButton");

/* -------------------------------- */
/* BLAND KORTSTOKK */
/* -------------------------------- */

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        [array[i], array[j]] =
        [array[j], array[i]];
    }

    return array;
}

let deck = [];

function refillDeck() {

    deck =
        shuffle(
            [...images]
        );
}

/* -------------------------------- */
/* HENT NESTE BILDE */
/* -------------------------------- */

function drawCard() {

    if (
        deck.length === 0
    ) {

        refillDeck();

    }

    return deck.pop();
}

/* -------------------------------- */
/* TV-GLITCH */
/* -------------------------------- */

function activateGlitch() {

    vhs.classList.add(
        "active"
    );

    setTimeout(() => {

        vhs.classList.remove(
            "active"
        );

    }, 1000);
}

/* -------------------------------- */
/* SPILL SKURRING */
/* -------------------------------- */

function playNoise(volume) {

    staticSound.pause();

    staticSound.currentTime = 0;

    staticSound.volume = volume;

    staticSound.play()
        .catch(() => {});
}

/* -------------------------------- */
/* VIS BILDE */
/* -------------------------------- */

function flashImage() {

    const card =
        drawCard();

    background.style.backgroundImage =
        `url('${card.file}')`;

    background.style.backgroundPosition =
        `${Math.random()*100}% ${Math.random()*100}%`;

    background.classList.add(
        "show"
    );

    activateGlitch();

    let duration;
    let volume;

    if (
        card.type ===
        "common"
    ) {

        duration =
            2200 +
            Math.random()*1000;

        volume = 0.35;

    }

    else if (
        card.type ===
        "rare"
    ) {

        duration =
            1100 +
            Math.random()*500;

        volume = 0.55;

    }

    else {

        duration =
            700;

        volume = 0.80;

    }

    playNoise(volume);

    setTimeout(() => {

        background.classList.remove(
            "show"
        );

    }, duration);

    const nextFlash =

        2000 +

        Math.random()*4000;

    setTimeout(
        flashImage,
        nextFlash
    );
}

/* -------------------------------- */
/* START */
/* -------------------------------- */

startButton.addEventListener(
    "click",
    () => {

        startButton.classList.add(
            "hidden"
        );

        refillDeck();

        flashImage();

    }
);

</script>
