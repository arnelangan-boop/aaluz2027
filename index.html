<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ÅLUZ 2027</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{
    background:#000;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
}

/* BAKGRUNNSBILDE */

#background{
    position:fixed;
    inset:0;

    background-size:cover;

    opacity:0;
    transform:scale(1.08);

    transition:
        opacity .4s ease,
        transform 1.5s ease;
}

#background.show{
    opacity:.92;
    transform:scale(1);
}

/* VHS-STØY */

.noise{
    position:fixed;
    inset:0;

    pointer-events:none;

    background-image:
    repeating-linear-gradient(
        0deg,
        rgba(255,255,255,.03) 0px,
        rgba(255,255,255,.03) 1px,
        transparent 1px,
        transparent 4px
    );

    animation:flicker .12s infinite;
}

@keyframes flicker{

    0%{opacity:.10;}
    50%{opacity:.04;}
    100%{opacity:.10;}

}

/* GLITCH-EFFEKT */

.vhs{
    position:fixed;
    inset:0;

    pointer-events:none;

    z-index:4;

    opacity:0;
}

.vhs.active{
    opacity:1;
}

.vhs::before{

    content:"";

    position:absolute;
    inset:0;

    background:
    repeating-linear-gradient(
        0deg,
        rgba(255,255,255,.05) 0px,
        rgba(255,255,255,.05) 1px,
        transparent 1px,
        transparent 3px
    );

}

.vhs::after{

    content:"";

    position:absolute;
    inset:0;

    background:
    linear-gradient(
        90deg,
        rgba(255,0,0,.04),
        transparent 35%,
        rgba(0,255,255,.05) 70%,
        transparent
    );

    animation:glitchShift .12s infinite;

}

@keyframes glitchShift{

    0%{
        transform:translateX(-4px);
    }

    50%{
        transform:translateX(3px);
    }

    100%{
        transform:translateX(-2px);
    }

}

/* VIGNETT */

.overlay{

    position:fixed;
    inset:0;

    background:
    radial-gradient(
        circle,
        rgba(0,0,0,.15),
        rgba(0,0,0,.90)
    );

}

/* TEKST */

.content{

    position:fixed;
    inset:0;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    z-index:10;
}

h1{

    color:white;

    font-size:clamp(3rem,8vw,7rem);

    letter-spacing:.6rem;

    text-shadow:
        0 0 15px rgba(255,255,255,.25),
        0 0 50px rgba(255,255,255,.10);
}

.subtitle{

    margin-top:15px;

    color:#d0d0d0;

    letter-spacing:.45rem;

    text-transform:uppercase;
}

.enter{

    margin-top:40px;

    padding:12px 24px;

    border:1px solid rgba(255,255,255,.3);

    color:white;

    cursor:pointer;

    transition:.2s;
}

.enter:hover{

    background:rgba(255,255,255,.08);

}

.hidden{
    display:none;
}

</style>
</head>

<body>

<div id="background"></div>

<div id="vhs" class="vhs"></div>

<div class="noise"></div>

<div class="overlay"></div>

<div class="content">

    <h1>ÅLUZ 2027</h1>

    <div class="subtitle">
        soon
    </div>

    <div id="startButton" class="enter">
        ENTER
    </div>

</div>

<audio id="staticSound" preload="auto">
    <source src="static.mp3" type="audio/mpeg">
</audio>

<script>

/* -------------------- */
/* BILDER */
/* -------------------- */

const commonImages = [
    "beer.jpg",
    "boat.jpg",
    "table.jpg",
    "group.jpg"
];

const rareImages = [
    "toilet.jpg",
    "fuel.jpg"
];

const legendaryImages = [
    "finger.jpg",
    "hat.jpg"
];

const background =
    document.getElementById("background");

const vhs =
    document.getElementById("vhs");

const staticSound =
    document.getElementById("staticSound");

const startButton =
    document.getElementById("startButton");

/* -------------------- */
/* VELG BILDE */
/* -------------------- */

function pickImage(){

    const roll =
        Math.random() * 100;

    if(roll < 75){

        return {

            image:
            commonImages[
                Math.floor(
                    Math.random() *
                    commonImages.length
                )
            ],

            type:"common"
        };
    }

    if(roll < 97){

        return {

            image:
            rareImages[
                Math.floor(
                    Math.random() *
                    rareImages.length
                )
            ],

            type:"rare"
        };
    }

    return {

        image:
        legendaryImages[
            Math.floor(
                Math.random() *
                legendaryImages.length
            )
        ],

        type:"legendary"
    };
}

/* -------------------- */
/* VIS BILDE */
/* -------------------- */

function flashImage(){

    const result =
        pickImage();

    background.style.backgroundImage =
        `url('${result.image}')`;

    background.style.backgroundPosition =
        `${Math.random()*100}% ${Math.random()*100}%`;

    background.classList.add("show");

    vhs.classList.add("active");

    /* LYD */

    staticSound.currentTime = 0;

    staticSound.volume =

        result.type === "legendary"

        ? 0.8

        : 0.5;

    staticSound.play()
        .catch(()=>{});

    let duration;

    if(result.type === "common"){

        duration =
            1500 +
            Math.random()*1000;

    }
    else if(result.type === "rare"){

        duration = 900;

    }
    else{

        duration = 550;

    }

    setTimeout(()=>{

        background.classList.remove("show");

        vhs.classList.remove("active");

    }, duration);

    const nextFlash =

        2000 +

        Math.random()*5000;

    setTimeout(
        flashImage,
        nextFlash
    );
}

/* -------------------- */
/* START */
/* -------------------- */

startButton.addEventListener(
"click",
()=>{

    startButton.classList.add(
        "hidden"
    );

    flashImage();

});

</script>

</body>
</html>
