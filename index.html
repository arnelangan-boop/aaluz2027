<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ÅLUZ 2027</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
}

#background{
    position:fixed;
    inset:0;
    background-size:cover;
    background-position:center center;
    opacity:0;
    transform:scale(1.08);
    transition:
        opacity 0.15s ease,
        transform 0.5s ease;
}

#background.show{
    opacity:0.9;
    transform:scale(1);
}

.overlay{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle,
        rgba(0,0,0,0.2),
        rgba(0,0,0,0.88));
}

.content{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:10;
}

h1{
    color:white;
    font-size:clamp(3rem,8vw,6rem);
    letter-spacing:0.5rem;
    text-transform:uppercase;

    text-shadow:
        0 0 10px rgba(255,255,255,.2),
        0 0 40px rgba(255,255,255,.15);
}

.subtitle{
    color:#d0d0d0;
    margin-top:15px;
    letter-spacing:0.4rem;
    text-transform:uppercase;
}

</style>
</head>

<body>

<div id="background"></div>
<div class="overlay"></div>

<div class="content">
    <h1>ÅLUZ 2027</h1>
    <div class="subtitle">soon</div>
</div>

<script>

// ---------------------------------------------------
// Vanlige blink (80%)
// ---------------------------------------------------

const commonImages = [
    "beer.jpg",
    "boat.jpg",
    "table.jpg",
    "group.jpg"
];

// ---------------------------------------------------
// Sjeldne blink (15%)
// ---------------------------------------------------

const rareImages = [
    "toilet.jpg",
    "fuel.jpg"
];

// ---------------------------------------------------
// Legendariske blink (5%)
// ---------------------------------------------------

const legendaryImages = [
    "finger.jpg",
    "hat.jpg"
];

const bg = document.getElementById("background");

function pickImage() {

    const roll = Math.random() * 100;

    if (roll < 80) {
        return commonImages[
            Math.floor(Math.random()*commonImages.length)
        ];
    }

    if (roll < 95) {
        return rareImages[
            Math.floor(Math.random()*rareImages.length)
        ];
    }

    return legendaryImages[
        Math.floor(Math.random()*legendaryImages.length)
    ];
}

function flash() {

    const image = pickImage();

    bg.style.backgroundImage =
        `url('${image}')`;

    bg.classList.add("show");

    const duration =
        120 + Math.random()*180;

    setTimeout(() => {
        bg.classList.remove("show");
    }, duration);

    const nextFlash =
        4000 + Math.random()*12000;

    setTimeout(flash, nextFlash);
}

setTimeout(flash, 5000);
    
</script>

</body>
</html>
